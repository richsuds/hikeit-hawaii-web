name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://hikeit-hawaii-api-test.onrender.com
          VITE_GA_MEASUREMENT_ID: G-36F941PHGD
          VITE_ADSENSE_PUBLISHER_ID: ca-pub-9195975174559381
          VITE_ADSENSE_FORECAST_SLOT: ${{ vars.ADSENSE_FORECAST_SLOT }}
          VITE_ADSENSE_TRAILS_SLOT: ${{ vars.ADSENSE_TRAILS_SLOT }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
